name: build-and-publish

on:
  push:
    branches: [master, main]
    paths:
      - 'src/**'
      - 'java/**'
      - 'test/**'
      - 'resources/**'
      - 'pom.xml'
      - 'mvnw'
      - 'mvnw.cmd'
      - '.mvn/wrapper/**'
      - 'scripts/**'
      - '.github/workflows/build.yml'
      - 'VERSIONING.md'
      - 'ARTIFACT_IDENTITY.md'
      - 'README.md'
      - 'AGENTS.md'
      - 'MODERNIZATION_PLAN.md'
      - 'docs/build-modernization-status.md'
  pull_request:
    branches: [master, main]
    paths:
      - 'src/**'
      - 'java/**'
      - 'test/**'
      - 'resources/**'
      - 'pom.xml'
      - 'mvnw'
      - 'mvnw.cmd'
      - '.mvn/wrapper/**'
      - 'scripts/**'
      - '.github/workflows/build.yml'
      - '.github/workflows/compatibility.yml'
      - 'VERSIONING.md'
      - 'ARTIFACT_IDENTITY.md'
      - 'README.md'
      - 'AGENTS.md'
      - 'MODERNIZATION_PLAN.md'
      - 'docs/build-modernization-status.md'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and upload"
        required: true
      bridge_version:
        description: "Exact canonical Bridge version; development builds may leave empty to resolve newest dev build"
        required: false

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

env:
  BRIDGE_OWNER: ${{ github.repository_owner }}
  BRIDGE_VERSION: ${{ inputs.bridge_version || vars.BRIDGE_VERSION || '' }}
  BRIDGE_PACKAGES_USERNAME: ${{ vars.BRIDGE_PACKAGES_USERNAME || github.actor }}
  BRIDGE_PACKAGES_TOKEN: ${{ secrets.BRIDGE_PACKAGES_TOKEN || github.token }}
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  SOURCE_REF: ${{ github.head_ref || github.ref }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Verify artifact identity
        run: |
          if grep -F 'net.ME1312' pom.xml; then
            echo "Legacy upstream Maven coordinates remain in the active POM."
            exit 1
          fi
          grep -F '<groupId>io.github.supracraft.vanillacord</groupId>' pom.xml
          grep -F '<artifactId>vanillacord</artifactId>' pom.xml
          grep -F '<version>2.9.0-dev</version>' pom.xml
          grep -F '<groupId>io.github.supracraft.bridge</groupId>' pom.xml

      - name: Set up JDK
        uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          server-id: bridge-github
          server-username: BRIDGE_PACKAGES_USERNAME
          server-password: BRIDGE_PACKAGES_TOKEN

      - name: Verify pinned Maven
        run: |
          ./mvnw --version | tee /tmp/maven-version.txt
          grep -F 'Apache Maven 3.9.16' /tmp/maven-version.txt

      - name: Derive version
        id: version
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VER="${GITHUB_REF_NAME#v}"
          else
            SOURCE_VERSION="$(python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('pom.xml').getroot()
          ns = {'m': 'http://maven.apache.org/POM/4.0.0'}
          print(root.find('m:version', ns).text.strip())
          PY
          )"
            case "${SOURCE_VERSION}" in
              *-dev) VER="${SOURCE_VERSION}.${GITHUB_RUN_NUMBER}" ;;
              *) echo "Non-release source version must end in -dev; got ${SOURCE_VERSION}" >&2; exit 1 ;;
            esac
          fi
          echo "VALUE=$VER" >> "$GITHUB_OUTPUT"

      - name: Set project version
        run: ./mvnw -B -q org.codehaus.mojo:versions-maven-plugin:2.21.0:set -DnewVersion=${{ steps.version.outputs.VALUE }} -DgenerateBackupPoms=false

      - name: Resolve newest canonical Bridge dev build
        if: env.BRIDGE_VERSION == ''
        env:
          GITHUB_TOKEN: ${{ env.BRIDGE_PACKAGES_TOKEN }}
        run: |
          VERSION="$(./scripts/resolve-bridge-version.sh)"
          echo "Using Bridge ${VERSION}"
          echo "BRIDGE_VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Record build inputs
        run: |
          cat > BUILD-METADATA.properties <<EOF
          group=io.github.supracraft.vanillacord
          artifact=vanillacord
          version=${{ steps.version.outputs.VALUE }}
          bridge.coordinate=io.github.supracraft.bridge:bridge:${BRIDGE_VERSION}
          source.repository=SupraCraft/VanillaCord
          upstream.repository=ME1312/VanillaCord
          git.commit=${SOURCE_SHA}
          git.ref=${SOURCE_REF}
          github.run=${GITHUB_RUN_NUMBER}
          maven.version=3.9.16
          maven.wrapper.version=3.3.4
          EOF

      - name: Build, test, and generate SBOM
        run: >-
          ./mvnw -B verify
          -Dbridge.owner=${BRIDGE_OWNER}
          -Dbridge.version=${BRIDGE_VERSION}
          -Dbuild.commit=${SOURCE_SHA}
          -Dbuild.ref=${SOURCE_REF}
          -Dbuild.number=${GITHUB_RUN_NUMBER}

      - name: Create temporary compatibility alias
        run: cp "artifacts/supracraft-vanillacord-${{ steps.version.outputs.VALUE }}.jar" artifacts/VanillaCord.jar

      - name: Verify artifact contract
        run: >-
          bash ./scripts/verify-artifact-contract.sh
          "artifacts/supracraft-vanillacord-${{ steps.version.outputs.VALUE }}.jar"
          '${{ steps.version.outputs.VALUE }}'
          "${BRIDGE_VERSION}"
          "${SOURCE_SHA}"
          ARTIFACT-INVENTORY.txt

      - name: Verify compatibility alias
        run: cmp "artifacts/supracraft-vanillacord-${{ steps.version.outputs.VALUE }}.jar" artifacts/VanillaCord.jar

      - name: Generate checksums
        run: sha256sum "artifacts/supracraft-vanillacord-${{ steps.version.outputs.VALUE }}.jar" artifacts/VanillaCord.jar build/vanillacord-sbom.json > SHA256SUMS

      - name: Upload build evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: supracraft-vanillacord-${{ steps.version.outputs.VALUE }}
          path: |
            artifacts/supracraft-vanillacord-${{ steps.version.outputs.VALUE }}.jar
            artifacts/VanillaCord.jar
            build/vanillacord-sbom.json
            BUILD-METADATA.properties
            ARTIFACT-INVENTORY.txt
            SHA256SUMS
          if-no-files-found: error

  release:
    if: github.event_name != 'push' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      - name: Determine tag
        id: vars
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "release" ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="${{ inputs.tag }}"
          fi
          if [[ -z "${TAG}" ]]; then
            echo "Tag is required."
            exit 1
          fi
          echo "TAG=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ steps.vars.outputs.TAG }}

      - name: Set up JDK
        uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          server-id: bridge-github
          server-username: BRIDGE_PACKAGES_USERNAME
          server-password: BRIDGE_PACKAGES_TOKEN

      - name: Verify pinned Maven
        run: |
          ./mvnw --version | tee /tmp/maven-version.txt
          grep -F 'Apache Maven 3.9.16' /tmp/maven-version.txt

      - name: Derive version
        id: version
        run: |
          VER="${{ steps.vars.outputs.TAG }}"
          echo "VALUE=${VER#v}" >> "$GITHUB_OUTPUT"

      - name: Set project version
        run: ./mvnw -B -q org.codehaus.mojo:versions-maven-plugin:2.21.0:set -DnewVersion=${{ steps.version.outputs.VALUE }} -DgenerateBackupPoms=false

      - name: Use source-pinned Bridge version
        if: env.BRIDGE_VERSION == ''
        run: |
          VERSION="$(python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('pom.xml').getroot()
          ns = {'m': 'http://maven.apache.org/POM/4.0.0'}
          print(root.find("m:properties/m:bridge.version", ns).text.strip())
          PY
          )"
          echo "Using source-pinned Bridge ${VERSION}"
          echo "BRIDGE_VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Record release inputs
        run: |
          cat > BUILD-METADATA.properties <<EOF
          group=io.github.supracraft.vanillacord
          artifact=vanillacord
          version=${{ steps.version.outputs.VALUE }}
          bridge.coordinate=io.github.supracraft.bridge:bridge:${BRIDGE_VERSION}
          source.repository=SupraCraft/VanillaCord
          upstream.repository=ME1312/VanillaCord
          git.commit=${SOURCE_SHA}
          git.ref=${SOURCE_REF}
          github.run=${GITHUB_RUN_NUMBER}
          maven.version=3.9.16
          maven.wrapper.version=3.3.4
          EOF

      - name: Build, test, and generate SBOM
        run: >-
          ./mvnw -B verify
          -Dbridge.owner=${BRIDGE_OWNER}
          -Dbridge.version=${BRIDGE_VERSION}
          -Dbuild.commit=${SOURCE_SHA}
          -Dbuild.ref=${SOURCE_REF}
          -Dbuild.number=${GITHUB_RUN_NUMBER}

      - name: Create temporary compatibility alias
        run: cp "artifacts/supracraft-vanillacord-${{ steps.version.outputs.VALUE }}.jar" artifacts/VanillaCord.jar

      - name: Verify artifact contract
        run: >-
          bash ./scripts/verify-artifact-contract.sh
          "artifacts/supracraft-vanillacord-${{ steps.version.outputs.VALUE }}.jar"
          '${{ steps.version.outputs.VALUE }}'
          "${BRIDGE_VERSION}"
          ""
          ARTIFACT-INVENTORY.txt

      - name: Verify compatibility alias
        run: cmp "artifacts/supracraft-vanillacord-${{ steps.version.outputs.VALUE }}.jar" artifacts/VanillaCord.jar

      - name: Generate checksums
        run: sha256sum "artifacts/supracraft-vanillacord-${{ steps.version.outputs.VALUE }}.jar" artifacts/VanillaCord.jar build/vanillacord-sbom.json > SHA256SUMS

      - name: Publish release assets
        uses: softprops/action-gh-release@7c4723f7a335432393329f8f1c564994ce50185d
        with:
          tag_name: ${{ steps.vars.outputs.TAG }}
          files: |
            artifacts/supracraft-vanillacord-${{ steps.version.outputs.VALUE }}.jar
            artifacts/VanillaCord.jar
            build/vanillacord-sbom.json
            BUILD-METADATA.properties
            ARTIFACT-INVENTORY.txt
            SHA256SUMS
          fail_on_unmatched_files: true
