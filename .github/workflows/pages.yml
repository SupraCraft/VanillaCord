name: pages

on:
  push:
    branches: [master]
    paths:
      - 'PROJECT_CONTRACT.json'
      - 'PUBLIC_SURFACE.json'
      - 'BRAND_PROFILE.json'
      - 'GITHUB_METADATA.json'
      - 'STABLE_RELEASE.json'
      - 'SUPPORTED_MINECRAFT.json'
      - 'release-manifests/**'
      - 'docs/**'
      - 'scripts/build-public-site.py'
      - 'scripts/check-public-site.py'
      - 'package.json'
      - 'playwright.config.mjs'
      - 'lighthouserc.cjs'
      - 'tests/site/**'
      - '.github/workflows/pages.yml'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'

      - name: Install web QA dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Install Playwright browser engines
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run candidate Playwright browser and accessibility matrix
        run: npm run site:test

      - name: Resolve Chromium for Lighthouse
        run: |
          CHROME_PATH="$(node --input-type=module -e "import { chromium } from '@playwright/test'; process.stdout.write(chromium.executablePath())")"
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"

      - name: Run candidate Lighthouse CI budgets
        run: npm run site:lighthouse

      - name: Check external documentation links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8
        with:
          lycheeVersion: v0.24.2
          args: >-
            --verbose
            --no-progress
            --max-retries 2
            --timeout 20
            --accept 200,204,206,429
            --exclude '^http://127\.0\.0\.1(:[0-9]+)?/'
            --exclude '^https://supracraft\.github\.io/VanillaCord/'
            './README.md'
            './docs/**/*.md'
            './build/public-site/**/*.html'

      - name: Build production public site
        run: python3 ./scripts/build-public-site.py --output build/public-site

      - name: Validate built public site
        run: python3 ./scripts/check-public-site.py --site-dir build/public-site

      - name: Fetch pinned public-surface conformance validator
        run: >-
          curl -fsSL
          https://raw.githubusercontent.com/SupraShellScripts/github-ops-lab/5af6889bf31a86352f20a5963ed18f4ceaa741d1/scripts/public-web/validate-surface-contract.py
          -o build/validate-surface-contract.py

      - name: Validate production surface model and discovery
        run: >-
          python3 build/validate-surface-contract.py
          --contract PUBLIC_SURFACE.json
          --site-dir build/public-site
          --evidence build/public-surface-conformance.json

      - name: Upload public-site readiness diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pages-readiness-diagnostics
          path: |
            build/playwright-report
            build/playwright-results
            build/lighthouse
            build/public-surface-conformance.json
            lychee/out.md
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: build/public-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e

      - name: Smoke deployed deterministic public site
        run: python3 ./scripts/check-public-site.py --base-url "${{ steps.deployment.outputs.page_url }}"

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'

      - name: Install deployed-smoke dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Install Chromium for deployed smoke
        run: npx playwright install --with-deps chromium

      - name: Smoke primary user journey in deployed Chromium
        env:
          SITE_BASE_URL: ${{ steps.deployment.outputs.page_url }}
        run: npx playwright test tests/site/public-site.spec.mjs --project=desktop-chromium --grep "primary user journeys"
