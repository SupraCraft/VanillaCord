name: VanillaCord v2.9.0 PS5.1 release recovery qualification

on:
  pull_request:
    paths:
      - 'tools/Repair-VanillaCord290-AutoOverwrite.ps1'
      - '.github/workflows/qualify-v290-windows-repair.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actual-windows-powershell-51:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - name: Checkout untrusted candidate without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify actual Windows PowerShell 5.1 and negative-case fixtures
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSVersion.Major -ne 5 -or $PSVersionTable.PSVersion.Minor -ne 1) { throw 'NOT_NATIVE_WINDOWS_POWERSHELL_51' }
          & .\tools\Repair-VanillaCord290-AutoOverwrite.ps1 -SelfTest
      - name: Read-only live public release and safe-workflow preflight
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & .\tools\Repair-VanillaCord290-AutoOverwrite.ps1 -PublicPreflight
