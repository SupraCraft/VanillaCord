<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">VanillaCord connection illustration</title>
  <desc id="desc">The same server–cord–proxy silhouette used by the VanillaCord icon, enlarged as a minimal three-color hero.</desc>
  <rect width="1200" height="620" rx="42" fill="#514A42"/>

  <g transform="translate(110 164)">
    <rect width="260" height="300" rx="28" fill="#F1E2BF" stroke="#F1E2BF" stroke-width="16"/>
    <rect x="50" y="126" width="160" height="110" rx="12" fill="#514A42"/>
    <rect x="98" y="161" width="64" height="48" rx="8" fill="#B86B3F"/>
  </g>

  <g transform="translate(830 138)">
    <rect width="260" height="334" rx="28" fill="#514A42" stroke="#F1E2BF" stroke-width="16"/>
    <rect x="48" y="70" width="164" height="24" rx="10" fill="#F1E2BF"/>
    <rect x="48" y="120" width="118" height="24" rx="10" fill="#B86B3F"/>
    <rect x="48" y="170" width="164" height="24" rx="10" fill="#F1E2BF"/>
    <rect x="48" y="220" width="136" height="24" rx="10" fill="#F1E2BF"/>
    <circle cx="210" cy="274" r="14" fill="#B86B3F"/>
  </g>

  <path d="M356 354 C500 230 682 472 848 344" fill="none" stroke="#F1E2BF" stroke-width="82" stroke-linecap="round"/>
  <path d="M356 354 C500 230 682 472 848 344" fill="none" stroke="#514A42" stroke-width="10" stroke-linecap="round" opacity=".35"/>
  <g fill="#B86B3F" stroke="#F1E2BF" stroke-width="10">
