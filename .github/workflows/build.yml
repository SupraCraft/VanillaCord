name: build-and-publish

on:
  push:
    branches: [master, main]
    paths:
      - 'src/**'
      - 'java/**'
      - 'test/**'
      - 'pom.xml'
      - 'scripts/**'
      - '.github/workflows/build.yml'
      - 'VERSIONING.md'
  pull_request:
    branches: [master, main]
    paths:
      - 'src/**'
      - 'java/**'
      - 'test/**'
      - 'pom.xml'
      - 'scripts/**'
      - '.github/workflows/build.yml'
      - '.github/workflows/compatibility.yml'
      - 'VERSIONING.md'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and upload"
        required: true
      bridge_version:
        description: "Exact Bridge version; leave empty to resolve current compatible snapshot"
        required: false

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BRIDGE_OWNER: ${{ github.repository_owner }}
  BRIDGE_VERSION: ${{ inputs.bridge_version || vars.BRIDGE_VERSION || '' }}
  BRIDGE_PACKAGES_USERNAME: ${{ vars.BRIDGE_PACKAGES_USERNAME || github.actor }}
  BRIDGE_PACKAGES_TOKEN: ${{ secrets.BRIDGE_PACKAGES_TOKEN || github.token }}
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  SOURCE_REF: ${{ github.head_ref || github.ref }}

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Verify no placeholder versions
        run: |
          if grep -F -- '-PLACEHOLDER' pom.xml; then
            echo "Found placeholder versions. Please replace -PLACEHOLDER before building."
            exit 1
          fi

      - name: Set up JDK
        uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          server-id: bridge-github
          server-username: BRIDGE_PACKAGES_USERNAME
          server-password: BRIDGE_PACKAGES_TOKEN

      - name: Derive version
        id: version
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VER="${GITHUB_REF_NAME#v}"
          else
            SOURCE_VERSION="$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)"
            BASE_VERSION="${SOURCE_VERSION%%-SNAPSHOT*}"
            VER="${BASE_VERSION}-SNAPSHOT.${GITHUB_RUN_NUMBER}"
          fi
          echo "VALUE=$VER" >> "$GITHUB_OUTPUT"

      - name: Set project version
        run: mvn -B -q org.codehaus.mojo:versions-maven-plugin:2.16.2:set -DnewVersion=${{ steps.version.outputs.VALUE }} -DgenerateBackupPoms=false

      - name: Resolve exact Bridge version
        if: env.BRIDGE_VERSION == ''
        env:
          BRIDGE_OWNER: ${{ env.BRIDGE_OWNER }}
          GITHUB_TOKEN: ${{ env.BRIDGE_PACKAGES_TOKEN }}
        run: |
          echo "Resolving Bridge version for owner ${BRIDGE_OWNER}"
          VERSION="$(./scripts/resolve-bridge-version.sh)"
          echo "Using Bridge ${VERSION}"
          echo "BRIDGE_VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Record build inputs
        run: |
          cat > BUILD-METADATA.properties <<EOF
          vanillacord.version=${{ steps.version.outputs.VALUE }}
          bridge.version=${BRIDGE_VERSION}
          git.commit=${SOURCE_SHA}
          git.ref=${SOURCE_REF}
          github.run=${GITHUB_RUN_NUMBER}
          EOF

      - name: Build, test, and generate SBOM
        run: >-
          mvn -B verify
          -Dbridge.owner=${BRIDGE_OWNER}
          -Dbridge.version=${BRIDGE_VERSION}
          -Dbuild.commit=${SOURCE_SHA}
          -Dbuild.ref=${SOURCE_REF}
          -Dbuild.number=${GITHUB_RUN_NUMBER}

      - name: Generate checksums
        run: sha256sum artifacts/VanillaCord.jar build/vanillacord-sbom.json > SHA256SUMS

      - name: Upload build evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: VanillaCord-${{ steps.version.outputs.VALUE }}
          path: |
            artifacts/VanillaCord.jar
            build/vanillacord-sbom.json
            BUILD-METADATA.properties
            SHA256SUMS
          if-no-files-found: error

  release:
    if: github.event_name != 'push' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      - name: Determine tag
        id: vars
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "release" ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="${{ inputs.tag }}"
          fi
          if [[ -z "${TAG}" ]]; then
            echo "Tag is required."
            exit 1
          fi
          echo "TAG=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ steps.vars.outputs.TAG }}

      - name: Verify no placeholder versions
        run: |
          if grep -F -- '-PLACEHOLDER' pom.xml; then
            echo "Found placeholder versions. Please replace -PLACEHOLDER before building."
            exit 1
          fi

      - name: Set up JDK
        uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          server-id: bridge-github
          server-username: BRIDGE_PACKAGES_USERNAME
          server-password: BRIDGE_PACKAGES_TOKEN

      - name: Derive version
        id: version
        run: |
          VER="${{ steps.vars.outputs.TAG }}"
          VER="${VER#v}"
          echo "VALUE=$VER" >> "$GITHUB_OUTPUT"

      - name: Set project version
        run: mvn -B -q org.codehaus.mojo:versions-maven-plugin:2.16.2:set -DnewVersion=${{ steps.version.outputs.VALUE }} -DgenerateBackupPoms=false

      - name: Resolve exact Bridge version
        if: env.BRIDGE_VERSION == ''
        env:
          BRIDGE_OWNER: ${{ env.BRIDGE_OWNER }}
          GITHUB_TOKEN: ${{ env.BRIDGE_PACKAGES_TOKEN }}
        run: |
          echo "Resolving Bridge version for owner ${BRIDGE_OWNER}"
          VERSION="$(./scripts/resolve-bridge-version.sh)"
          echo "Using Bridge ${VERSION}"
          echo "BRIDGE_VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Record release inputs
        run: |
          cat > BUILD-METADATA.properties <<EOF
          vanillacord.version=${{ steps.version.outputs.VALUE }}
          bridge.version=${BRIDGE_VERSION}
          git.commit=${SOURCE_SHA}
          git.ref=${SOURCE_REF}
          github.run=${GITHUB_RUN_NUMBER}
          EOF

      - name: Build, test, and generate SBOM
        run: >-
          mvn -B verify
          -Dbridge.owner=${BRIDGE_OWNER}
          -Dbridge.version=${BRIDGE_VERSION}
          -Dbuild.commit=${SOURCE_SHA}
          -Dbuild.ref=${SOURCE_REF}
          -Dbuild.number=${GITHUB_RUN_NUMBER}

      - name: Generate checksums
        run: sha256sum artifacts/VanillaCord.jar build/vanillacord-sbom.json > SHA256SUMS

      - name: Publish release assets
        uses: softprops/action-gh-release@7c4723f7a335432393329f8f1c564994ce50185d
        with:
          tag_name: ${{ steps.vars.outputs.TAG }}
          files: |
            artifacts/VanillaCord.jar
            build/vanillacord-sbom.json
            BUILD-METADATA.properties
            SHA256SUMS
          fail_on_unmatched_files: true
